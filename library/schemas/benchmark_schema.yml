$schema: http://json-schema.org/draft-07/schema#
type: object
required:
  - id
  - runtime
  - name
  - category
  - severity
  - architectures
  - os
  - type
  - expected
properties:
  id:
    type: string
    pattern: '^[a-z]+\.[a-z]+\.[a-z]+\.[0-9]+$'
  runtime:
    type: string
  name:
    type: string
  category:
    type: string
  severity:
    enum: [low, medium, high, critical]
  architectures:
    type: array
    items:
      type: string
  os:
    type: array
    items:
      type: string
  type:
    enum: [regression, security, performance, functional]
  expected:
    type: object
    properties:
      result:
        enum: [pass, fail, crash, timeout]
      exit_code:
        type: integer
      output_contains:
        type: array
        items:
          type: string
      output_does_not_contain:
        type: array
        items:
          type: string
